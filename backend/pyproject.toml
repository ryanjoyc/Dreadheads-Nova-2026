[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-sales-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "pydantic-settings>=2.6,<3", "SQLAlchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2", "uvicorn>=0.32,<1"
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.9,<1", "setuptools>=75"]

[tool.setuptools.packages.find]
include = ["nova_backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
